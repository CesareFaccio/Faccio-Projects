<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BetaScope — Cesare Faccio</title>
  <style>
    :root {
      --bg: #0d0f12; --bg-card: #16191e; --border: #26292f;
      --text: #eceef0; --text-dim: #9aa0a8; --accent: #5eead4;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f8; --bg-card: #ffffff; --border: #e3e4e7;
        --text: #16181c; --text-dim: #61666e; --accent: #0f766e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 480px; padding: 32px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 1.8rem; letter-spacing: -0.02em; }
    p { color: var(--text-dim); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge {
      display: inline-block; margin-bottom: 20px; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent);
      border-radius: 999px; padding: 3px 10px;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">In progress</span>
    <h1>BetaScope</h1>
    <p>
      A climbing video analyser — pose tracking, hold detection, and biomechanical
      force analysis, all computed in your browser. Being built right now.
    </p>
    <p><a href="/">&larr; back to projects</a></p>
  </main>
</body>
</html>
